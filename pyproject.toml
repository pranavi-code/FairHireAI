[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "roleready-ai"
version = "0.1.0"
description = "Evidence-backed student placement-readiness platform."
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.139,<0.140",
    "httpx>=0.28,<1",
    "pypdf>=6.8,<7",
    "pydantic-settings>=2.14,<3",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
ml = [
    "captum>=0.8,<1",
    "imageio-ffmpeg>=0.6,<1",
    "joblib>=1.5,<2",
    "numpy>=2.0,<3",
    "opensmile>=2.6,<2.7",
    "pandas>=2.2,<3",
    "pyarrow>=20,<26",
    "safetensors>=0.5,<1",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "torch>=2.7,<3",
    "transformers>=4.57,<5",
    "tqdm>=4.67,<5",
    "whisper-timestamped>=1.15,<2",
]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
include = ["backend*", "ml_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
